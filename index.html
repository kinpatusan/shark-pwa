<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shark Tooth Finder – Redirecting…</title>
  <link rel="stylesheet" href="/SharkTeethFinder/assets/style.css">
  <script>
  (function () {
    var langs = (navigator.languages || [navigator.language || 'en']).map(function (l) { return l.toLowerCase(); });
    var map = { 'ja': 'ja', 'zh-hant': 'zh-Hant', 'zh-tw': 'zh-Hant', 'zh-hk': 'zh-Hant', 'zh': 'zh-Hans', 'ko': 'ko',
                'de': 'de', 'es': 'es', 'fr': 'fr', 'it': 'it', 'pt': 'pt-BR' };
    for (var i = 0; i < langs.length; i++) {
      var l = langs[i];
      var keys = Object.keys(map);
      for (var k = 0; k < keys.length; k++) {
        if (l === keys[k] || l.indexOf(keys[k] + '-') === 0) { location.replace('/SharkTeethFinder/' + map[keys[k]] + '/'); return; }
      }
    }
    location.replace('/SharkTeethFinder/en/');
  })();
  </script>
</head>
<body>
  <div class="container">
    <section class="hero">
      <div class="hero-icon">🦷</div>
      <h1>Shark Tooth Finder</h1>
      <p style="color: rgba(255,255,255,0.7);">Redirecting to your language...</p>
      <p>
        <a href="/SharkTeethFinder/en/">English</a> ·
        <a href="/SharkTeethFinder/ja/">日本語</a> ·
        <a href="/SharkTeethFinder/zh-Hans/">简体中文</a> ·
        <a href="/SharkTeethFinder/zh-Hant/">繁體中文</a> ·
        <a href="/SharkTeethFinder/ko/">한국어</a> ·
        <a href="/SharkTeethFinder/de/">Deutsch</a> ·
        <a href="/SharkTeethFinder/es/">Español</a> ·
        <a href="/SharkTeethFinder/fr/">Français</a> ·
        <a href="/SharkTeethFinder/it/">Italiano</a> ·
        <a href="/SharkTeethFinder/pt-BR/">Português</a>
      </p>
    </section>
  </div>
</body>
</html>
